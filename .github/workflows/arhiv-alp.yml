name: Enkratno - premakni alpirocnik iz spletne mape v arhiv

on:
  workflow_dispatch:

jobs:
  premik:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Namesti lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Premakni v arhiv
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 4; set net:timeout 20; \
            open --env-password -u \"$FTP_USERNAME\" sftp://$FTP_SERVER; \
            mkdir -p -f arhiv; \
            mv pikapoka.com/www/alpirocnik arhiv/alpirocnik-s-pikapoka-2026-11-01; \
            echo '--- www'; cls -1 pikapoka.com/www/; echo '--- arhiv'; cls -1 arhiv/; echo '--- arhiv/alpirocnik (prvih nekaj)'; cls -1 arhiv/alpirocnik-s-pikapoka-2026-11-01/"
